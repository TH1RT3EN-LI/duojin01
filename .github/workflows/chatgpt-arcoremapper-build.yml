name: ChatGPT ARCoreMapper APK
on:
  push:
    branches:
      - chatgpt-arcoremapper-apk-20260922

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-tools.zip
          rm -rf /tmp/android-tools
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and patch source
        run: |
          cat chatgpt_arcoremapper_build/source.part*.b64 | tr -d '\n' | base64 -d > /tmp/arcoremapper.zip
          mkdir -p /tmp/arcoremapper-src
          unzip -q /tmp/arcoremapper.zip -d /tmp/arcoremapper-src
          sed -i 's/compileSdk 37/compileSdk 36/' /tmp/arcoremapper-src/ARCoreMapper/app/build.gradle
          sed -i 's/targetSdk 37/targetSdk 36/' /tmp/arcoremapper-src/ARCoreMapper/app/build.gradle
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' /tmp/arcoremapper-src/ARCoreMapper/gradle.properties
          test -f /tmp/arcoremapper-src/ARCoreMapper/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/arcoremapper-src/ARCoreMapper
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ARCoreMapper-RGB-debug-apk
          path: /tmp/arcoremapper-src/ARCoreMapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
